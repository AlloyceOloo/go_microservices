name: CD — Push Images to GHCR

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: users
            context: go_microservices/users
          - service: admin
            context: go_microservices/admin
          - service: ambassador
            context: go_microservices/ambassador
          - service: checkout
            context: go_microservices/checkout
          - service: email
            context: go_microservices/email
          - service: analytics
            context: go_microservices/analytics
          - service: react-frontend
            context: react-frontend
          - service: spark-job
            context: spark

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jumo-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/jumo-${{ matrix.service }}:${{ github.sha }}
