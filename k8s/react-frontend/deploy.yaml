apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend
  namespace: jumo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-frontend
  template:
    metadata:
      labels:
        app: react-frontend
    spec:
      containers:
        - name: react-frontend
          image: ghcr.io/kristy/jumo-react-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: react-frontend
  namespace: jumo-platform
spec:
  selector:
    app: react-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
