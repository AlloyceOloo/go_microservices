# ── MySQL for users service ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: users-db
  namespace: jumo-platform
spec:
  serviceName: users-db
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: mysql
          image: mysql:8
          env:
            - name: MYSQL_DATABASE
              value: users
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: jumo-secrets, key: DB_PASS }
          ports:
            - containerPort: 3306
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: jumo-platform
spec:
  selector:
    app: users-db
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
---
