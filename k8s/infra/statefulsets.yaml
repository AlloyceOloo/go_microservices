# ── PostgreSQL warehouse ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: warehouse-db
  namespace: jumo-platform
spec:
  serviceName: warehouse-db
  replicas: 1
  selector:
    matchLabels:
      app: warehouse-db
  template:
    metadata:
      labels:
        app: warehouse-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: warehouse
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: jumo-secrets, key: WAREHOUSE_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: jumo-secrets, key: WAREHOUSE_PASS }
          ports:
            - containerPort: 5432
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "384Mi" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-db
  namespace: jumo-platform
spec:
  selector:
    app: warehouse-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
