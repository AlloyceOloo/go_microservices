apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: jumo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: ghcr.io/kristy/jumo-analytics:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: "50m",  memory: "64Mi"  }
            limits:   { cpu: "200m", memory: "256Mi" }
          envFrom:
            - configMapRef:  { name: jumo-config }
            - secretRef:     { name: jumo-secrets }
          env:
            - name: DB_HOST
              value: warehouse-db
            - name: DB_NAME
              value: warehouse
          livenessProbe:
            httpGet: { path: /api/analytics/daily-summary, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/analytics/daily-summary, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
