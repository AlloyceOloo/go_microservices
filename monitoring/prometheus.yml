global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: users
    static_configs:
      - targets: ['users:8000']

  - job_name: admin
    static_configs:
      - targets: ['admin:8000']

  - job_name: ambassador
    static_configs:
      - targets: ['ambassador:8000']

  - job_name: checkout
    static_configs:
      - targets: ['checkout:8000']

  - job_name: analytics
    static_configs:
      - targets: ['analytics:8000']

  - job_name: postgres-warehouse
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: kafka-jmx
    static_configs:
      - targets: ['kafka-jmx-exporter:5556']
